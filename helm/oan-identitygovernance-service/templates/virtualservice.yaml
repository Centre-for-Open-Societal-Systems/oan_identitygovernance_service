{{- if and .Values.istio.enabled .Values.istio.virtualservice.enabled }}
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
spec:
  hosts:
    - {{ tpl .Values.istio.virtualservice.host $ | quote }}
  gateways:
    - {{ tpl .Values.istio.virtualservice.gateway $ }}
  http:
    - headers:
        request:
          set:
            x-forwarded-host: {{ tpl .Values.istio.virtualservice.host $ | quote }}
            x-forwarded-proto: https
      route:
        - destination:
            host: {{ include "common.names.fullname" . }}
            port:
              number: {{ .Values.service.port }}
{{- end }}

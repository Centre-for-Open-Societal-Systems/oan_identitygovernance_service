{{- if and .Values.istio.enabled .Values.istio.gateway.enabled }}
{{- $host := default (tpl .Values.istio.virtualservice.host $) (tpl .Values.istio.gateway.host $) }}
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
spec:
  selector: {{- include "common.tplvalues.render" (dict "value" .Values.istio.gateway.ingressController "context" $) | nindent 4 }}
  servers:
  {{- if .Values.istio.gateway.httpEnabled }}
  - port:
      name: http2
      number: 8080
      protocol: HTTP2
    hosts:
      - {{ $host | quote }}
    {{- if .Values.istio.gateway.httpTlsRedirect }}
    tls:
      httpsRedirect: true
    {{- end }}
  {{- end }}
  {{- if .Values.istio.gateway.httpsEnabled }}
  - port:
      name: https
      number: 8443
      protocol: HTTPS
    hosts:
      - {{ $host | quote }}
    tls: {{- include "common.tplvalues.render" (dict "value" (omit .Values.istio.gateway.tls "enabled") "context" $) | nindent 6 }}
  {{- end }}
{{- end }}

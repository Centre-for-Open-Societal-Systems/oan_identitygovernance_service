[project]
name = "central-rbac"
version = "0.1.0"
description = "Central RBAC control plane over Keycloak and managed services"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "central-rbac"
version = "0.1.0"
description = "Central RBAC control plane over Keycloak and managed services"
requires-python = ">=3.12"
dependencies = [
  "openg2p-fastapi-common>=1.1.6",
  "sqlalchemy[asyncio]>=2.0.20",
  "asyncpg>=0.29",
  "pydantic[email]>=2.8",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
]

[tool.setuptools.packages.find]
include = ["app*"]
